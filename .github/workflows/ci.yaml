# CI for Product Catalog Service

name: product-catalog-ci

on:
    pull_request:
        branches:
            - main 

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Setup Go 1.22
          uses: actions/setup-go@v2
          with:
            go-version: 1.22
        
        - name: Build
          run: |
            cd src/product-catalog
            go mod download
            go build -o product-catalog-service main.go
        
        - name: unit test
          run: |
            cd src/product-catalog
            go test ./...

    code-quality:
        runs-on: ubuntu-latest

        steps: 
        - name: checkout code
          uses: actions/checkout@v4

        - name: Run golangci-lint
          run: |
                go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.56.2
                golangci-lint run src/product-catalog/...

    
    
    docker:
        runs-on: ubuntu-latest

        needs: build

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Debug secret (length only, value is masked)
          env:
            DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          run: echo "DOCKER_USERNAME length=${#DOCKER_USER}"

        - name: Setup Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Build and Push Docker Image
          uses: docker/build-push-action@v6
          with:
            context: src/product-catalog
            file: src/product-catalog/Dockerfile
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}
              ${{ secrets.DOCKER_USERNAME }}/product-catalog:latest


        
    updatek8s:
        runs-on: ubuntu-latest

        needs: docker

        steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: Update tag in k8s deployment manifest
          run: |
                sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml

        - name: Commit and push changes
          run: |
                git config --global user.email "yemulakondarohit@gmail.com"
                git config --global user.name "Yemulakonda Rohit"
                git add kubernetes/productcatalog/deploy.yaml
                git commit -m "[CI]: Update product catalog image tag"
                git push origin HEAD:main -f
        
                